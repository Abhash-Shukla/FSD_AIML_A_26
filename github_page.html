<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GitHub Profile Table</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #333; padding: 8px; text-align: center; }
    th { background-color: #f4f4f4; }
    img { border-radius: 50%; width: 80px; }
  </style>
</head>
<body>
  <h1>GitHub Profile Viewer</h1>
  <input type="text" id="username" placeholder="Enter GitHub username">
  <button onclick="getProfile()">Fetch Profile</button>

  <h2>Profile Info</h2>
  <table id="profileTable"></table>

  <h2>Repositories</h2>
  <table id="repoTable"></table>

  <script>
    async function getProfile() {
      const user = document.getElementById('username').value;

      // Fetch profile data
      const profileRes = await fetch(`https://api.github.com/users/${user}`);
      const profileData = await profileRes.json();

      // Build profile table
      document.getElementById('profileTable').innerHTML = `
        <tr>
          <th>Avatar</th>
          <th>Name</th>
          <th>Bio</th>
          <th>Followers</th>
          <th>Following</th>
          <th>Public Repos</th>
          <th>Profile Link</th>
        </tr>
        <tr>
          <td><img src="${profileData.avatar_url}" alt="Avatar"></td>
          <td>${profileData.name || profileData.login}</td>
          <td>${profileData.bio || "No bio available"}</td>
          <td>${profileData.followers}</td>
          <td>${profileData.following}</td>
          <td>${profileData.public_repos}</td>
          <td><a href="${profileData.html_url}" target="_blank">Visit</a></td>
        </tr>
      `;

      // Fetch repositories
      const repoRes = await fetch(`https://api.github.com/users/${user}/repos`);
      const repos = await repoRes.json();

      // Build repo table
      let repoTable = `
        <tr>
          <th>Name</th>
          <th>Description</th>
          <th>Language</th>
          <th>Stars</th>
          <th>Link</th>
        </tr>
      `;
      repos.forEach(repo => {
        repoTable += `
          <tr>
            <td>${repo.name}</td>
            <td>${repo.description || "No description"}</td>
            <td>${repo.language || "N/A"}</td>
            <td>${repo.stargazers_count}</td>
            <td><a href="${repo.html_url}" target="_blank">View Repo</a></td>
          </tr>
        `;
      });
      document.getElementById('repoTable').innerHTML = repoTable;
    }
  </script>
</body>
</html>
