<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Fetch in JS</title>
  <style>
    table {
      margin: auto;
      width: 80%;
      padding: 10px;
      /* background-color: bisque; */
      color: #780000;
      border: 2px solid black;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid black;
      padding: 8px;
      text-align: center;
    }
    img {
      max-width: 100px;
      height: auto;
    }
    table caption {
      font-weight: bold;
      font-size: 40px;
      padding: 10px;
    }
  </style>
</head>
<body>
  <table>
    <caption>List Of Products</caption>
    <thead>
      <tr>
        <th>Sr. No</th>
        <th>Title</th>
        <th>Image</th>
        <th>QR Code</th>
        <th>Category</th>
        <th>Price</th>
        <th>Rating</th>
        <th>Stock</th>
      </tr>
    </thead>
    <tbody id="data"></tbody>
  </table>

  <script>
    const ele = document.getElementById("data");
    const URL = "https://dummyjson.com/products?limit=100&&skip=80"; // limit give how many items we want to see & skip let us skip ssome products

    async function loadProducts(URL) {
      try {
        const res = await fetch(URL); // to bring data from backend with some extra values
        const data = await res.json(); // filtering just data 
        console.log("Data =", data.products); // i only want to see products so data.products

        let rows = "";
        data.products.forEach((item, index) => {
          // Use thumbnail or fallback image
          const imgSrc = item.thumbnail || (item.images[0] ?? "https://via.placeholder.com/100?text=No+Image");

          // Generate QR code from product ID
          const qrURL = `https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=https://dummyjson.com/products/${item.id}`;

          rows += `
            <tr>
              <td>${index + 1}</td>
              <td>${item.title}</td>
              <td><img src="${imgSrc}" alt="Product Image"/></td>
              <td><img src="${qrURL}" alt="QR Code"/></td>
              <td>${item.category}</td>
              <td>₹${item.price}</td>
              <td>${item.rating}</td>
              <td>${item.stock}</td>
            </tr>
          `;
        });

        ele.innerHTML = (rows === "")
      ? "<tr><td colspan='6' style='color:red; text-align:center;'>Network Error: Please check your connection</td></tr>"
      : rows;
      }catch (err) {
    console.error("Error:", err);
    ele.innerHTML = "<tr><td colspan='6' style='color:red; text-align:center;'> Network Error: Please check your connection</td></tr>";
  }
    }

    loadProducts(URL);
  </script>
</body>
</html>
